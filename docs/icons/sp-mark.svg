<!-- Study Pods mark (chosen 2026-11-27, replacing the sp letters of 2026-11-06):
     a pea pod, tilted as if just picked, with four peas showing through; the
     last pea is Penna, "you". Umbra pod on a Hudson tile; the other peas are
     cut out in the tile's colour. Source for every app icon and favicon:
     node scripts/make-icons.mjs renders them all from this file. -->
