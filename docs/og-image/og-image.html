<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Study Pods · link preview (app/opengraph-image.png)</title>
<!--
  Source of app/opengraph-image.png (1200×630). Regenerate it with headless
  Chrome (or Playwright) after changing the copy (it must match landing.hero
  in messages/ja.json):
    chrome --headless=new --hide-scrollbars --window-size=1200,630
           --virtual-time-budget=5000 --screenshot=app/opengraph-image.png
           file:///…/docs/og-image/og-image.html
  Material 3 (item H): the app's palette (app/globals.css), Roboto + Noto Sans JP.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Roboto:wght@500;700&display=block">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #f8fafd; color: #1f1f1f;
    font-family: 'Roboto', 'Noto Sans JP', sans-serif;
  }
  .eyebrow { position: absolute; left: 96px; top: 84px; margin: 0; font: 500 28px/1.3 'Noto Sans JP', sans-serif;
             color: #444746; }
  h1 { position: absolute; left: 92px; top: 150px; margin: 0; font: 700 64px/90px 'Noto Sans JP', sans-serif; }
  h1 span { display: block; }
  h1 .accent { color: #0b57d0; }
  .board { position: absolute; right: 88px; top: 112px; width: 300px; padding: 22px 24px; box-sizing: border-box;
           background: #ffffff; border-radius: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 6px 16px 2px rgba(0,0,0,.06); }
  .row { margin-bottom: 18px; }
  .row:last-child { margin-bottom: 0; }
  .label { font: 500 20px 'Noto Sans JP', sans-serif; color: #444746; margin-bottom: 8px; }
  .track { height: 10px; border-radius: 999px; background: #d3e3fd; overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; background: #0b57d0; }
  footer { position: absolute; left: 0; right: 0; bottom: 0; height: 104px; background: #f0f4f9;
           display: flex; align-items: center; justify-content: space-between;
           padding: 0 96px; box-sizing: border-box; }
  .brand { font: 700 40px 'Roboto', sans-serif; }
  .url { font: 500 26px 'Roboto', sans-serif; color: #444746; }
</style>
</head>
<body>
  <p class="eyebrow">グループ課題のための、チームの進捗ボード</p>
  <h1><span>グループ課題を、</span><span>チームで分けて、</span><span class="accent">最後まで終わらせる。</span></h1>
  <div class="board" aria-hidden="true">
    <div class="row"><div class="label">スライド 12/15</div><div class="track"><div class="fill" style="width:80%"></div></div></div>
    <div class="row"><div class="label">発表原稿 1,800/3,000字</div><div class="track"><div class="fill" style="width:60%"></div></div></div>
    <div class="row"><div class="label">図表 2/6</div><div class="track"><div class="fill" style="width:33%"></div></div></div>
  </div>
  <footer><span class="brand">Study Pods</span><span class="url">study-pods.org</span></footer>
</body>
</html>
