<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Study Pods · link preview (app/opengraph-image.png)</title>
<!--
  Source of app/opengraph-image.png (1200×630). Regenerate it with headless
  Chrome (or Playwright) after changing the copy (it must match landing.hero
  in messages/ja.json):
    chrome --headless=new --hide-scrollbars --window-size=1200,630
           --virtual-time-budget=5000 --screenshot=app/opengraph-image.png
           file:///…/docs/og-image/og-image.html
  Soft pastel (2026-11-06): the app's palette (app/globals.css), Outfit +
  Noto Sans JP, and the pod mark (docs/icons/sp-mark.svg, since 2026-11-27).
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;500;700&family=Outfit:wght@300;500;700&display=block">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #f5f4f7; color: #1f1f1f;
    font-family: 'Outfit', 'Noto Sans JP', sans-serif;
  }
  .eyebrow { position: absolute; left: 96px; top: 80px; margin: 0; font: 500 26px/1.3 'Noto Sans JP', sans-serif; color: #4a4a4a; }
  h1 { position: absolute; left: 92px; top: 140px; margin: 0; font: 300 60px/86px 'Noto Sans JP', sans-serif; }
  h1 span { display: block; }
  h1 .strong { font-weight: 700; }
  .board { position: absolute; right: 88px; top: 96px; width: 330px; padding: 26px 28px; box-sizing: border-box;
           background: #bac8e0; border-radius: 28px; }
  .board h2 { margin: 0 0 18px; font: 700 22px 'Noto Sans JP', sans-serif; }
  .row { margin-bottom: 18px; }
  .row:last-child { margin-bottom: 0; }
  .label { font: 500 19px 'Noto Sans JP', sans-serif; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .track { height: 12px; border-radius: 999px; background: rgba(255,255,255,.7); overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; background: #1f1f1f; }
  .late { position: absolute; right: 88px; top: 404px; width: 330px; padding: 18px 28px; box-sizing: border-box;
          background: #ebdbd3; border-radius: 28px; font: 500 19px 'Noto Sans JP', sans-serif; }
  footer { position: absolute; left: 0; right: 0; bottom: 0; height: 104px; background: #ffffff;
           display: flex; align-items: center; justify-content: space-between;
           padding: 0 96px; box-sizing: border-box; }
  .brand { display: flex; align-items: center; gap: 16px; font: 700 38px 'Outfit', sans-serif; }
  .mark { width: 56px; height: 56px; }
  .url { font: 500 26px 'Outfit', sans-serif; color: #4a4a4a; }
</style>
</head>
<body>
  <p class="eyebrow">グループ課題のための、チームの進捗ボード</p>
  <h1><span>グループ課題を、</span><span>チームで分けて、</span><span class="strong">最後まで終わらせる。</span></h1>
  <div class="board" aria-hidden="true">
    <h2>チームの進み具合</h2>
    <div class="row"><div class="label"><span>スライド</span><span>12/15</span></div><div class="track"><div class="fill" style="width:80%"></div></div></div>
    <div class="row"><div class="label"><span>発表原稿</span><span>1,800/3,000字</span></div><div class="track"><div class="fill" style="width:60%"></div></div></div>
    <div class="row"><div class="label"><span>図表</span><span>2/6</span></div><div class="track"><div class="fill" style="width:33%"></div></div></div>
  </div>
  <div class="late" aria-hidden="true">図表 · 期限を過ぎています</div>
  <footer><span class="brand"><svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true">
  <rect x="4" y="4" width="92" height="92" rx="26" fill="#ebdbd3"/>
  <g transform="translate(-2.2 6.5) rotate(-25 50 50)">
    <path d="M10 50 Q50 20 90 50 Q50 80 10 50 Z" fill="#1f1f1f"/>
    <path d="M89 49 q7 -2 8 -10" fill="none" stroke="#1f1f1f" stroke-width="4" stroke-linecap="round"/>
    <circle cx="30" cy="50" r="6.2" fill="#ebdbd3"/>
    <circle cx="44" cy="50" r="6.2" fill="#ebdbd3"/>
    <circle cx="58" cy="50" r="6.2" fill="#ebdbd3"/>
    <circle cx="72" cy="50" r="6.2" fill="#bac8e0"/>
  </g>
</svg>
Study Pods</span><span class="url">study-pods.org</span></footer>
</body>
</html>
