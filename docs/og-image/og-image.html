  .brand { display: flex; align-items: center; gap: 16px; font: 700 38px 'Outfit', sans-serif; }
  .mark { width: 56px; height: 56px; }
  .url { font: 500 26px 'Outfit', sans-serif; color: #4a4a4a; }
