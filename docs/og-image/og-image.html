<!doctype html>

<title>Study Pods · link preview (app/opengraph-image.png)</title>
<!--

    chrome --headless=new --hide-scrollbars --window-size=1200,630

-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Fraunces:opsz,wght@9..144,600&family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@500&display=block">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background-color: #f6ecd6;
    background-image: repeating-linear-gradient(#f6ecd6, #f6ecd6 31px, #e8dbb9 32px);
    color: #3a2f22;
  }
  .margin { position: absolute; left: 72px; top: 0; height: 527px; width: 2px; background: rgba(181, 88, 63, .55); }
  .ring { position: absolute; left: 893px; top: 83px; width: 214px; height: 214px; border-radius: 50%;
          border: 7px solid rgba(201, 176, 130, .45); box-sizing: border-box; }
  .ring::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; border: 3px solid rgba(201, 176, 130, .35); }
  .eyebrow { position: absolute; left: 138px; top: 86px; font: 500 28px/1.3 'Zen Kaku Gothic New', sans-serif;
             letter-spacing: .04em; color: #6b5636; margin: 0; }
  h1 { position: absolute; left: 136px; top: 160px; margin: 0; font: 700 62px/88px 'Shippori Mincho', serif;
       letter-spacing: .06em; }
  h1 span { display: block; }
  .wave { position: absolute; left: 136px; top: 418px; }
  footer { position: absolute; left: 0; right: 0; bottom: 0; height: 103px; background: #fbf6e8;
           border-top: 2px solid #d9c69a; display: flex; align-items: center; justify-content: space-between;
           padding: 0 120px 0 138px; box-sizing: border-box; }
  .brand { font: 600 42px 'Fraunces', serif; color: #3a2f22; }
  .url { font: 26px 'Courier Prime', monospace; color: #6b5636; }

</head>
<body>
  <div class="margin"></div>
  <div class="ring"></div>
  <p class="eyebrow">同じ授業の、小さな学習グループ</p>
  <h1><span>ひとりで抱えこまない。</span><span>同じ授業の仲間と、</span><span>いっしょに進める。</span></h1>
  <svg class="wave" width="580" height="18" viewBox="0 0 580 18" fill="none">
    <path d="M2 10 C 90 4, 180 14, 290 8 S 480 4, 578 11" stroke="#b5583f" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <footer><span class="brand">Study Pods</span><span class="url">study-pods.org</span></footer>
