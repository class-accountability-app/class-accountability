<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf6e8" />
    <meta name="robots" content="noindex" />
    <title>オフラインです｜Study Pods</title>
    <!--
      Shown by the service worker (public/sw.js) when a page can't load
      because there is no network. Static and the same for everyone: it must
      never contain a student's data, so it is not an app page (those render
      the header and tab bar with the student's classes). The service worker
      can't tell the language, so it shows Japanese with English underneath.
      System fonts only, so nothing else has to be cached for it.
    -->
    <style>
      :root {
        --page-bg: #f6ecd6;
        --surface: #fbf6e8;
        --border: #d9c69a;
        --ink: #3a2f22;
        --muted: #6b5636;
        --accent: #b5583f;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background-color: var(--page-bg);
        background-image: repeating-linear-gradient(var(--page-bg), var(--page-bg) 27px, #e3d3ac 28px);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
          "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
        line-height: 1.8;
        padding: max(48px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }
      main {
        max-width: 28rem;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 2px;
        padding: 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      img { display: block; border-radius: 12px; }
      h1 { margin: 0; font-size: 26px; line-height: 1.45; font-weight: 700; }
      p { margin: 0; font-size: 16px; }
      .en { color: var(--muted); font-size: 15px; }
      h1 .en { display: block; font-size: 18px; font-weight: 600; }
      button {
        min-height: 48px;
        padding: 0 20px;
        border: 0;
        border-radius: 2px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="64" height="64" alt="" />
      <div class="card">
        <h1>オフラインです <span class="en" lang="en">You're offline</span></h1>
        <p>つながったら、もう一度お試しください。</p>
        <p class="en" lang="en">Try again when you're back online.</p>
        <button type="button" onclick="location.reload()">
          再読み込み <span lang="en">/ Reload</span>
        </button>
      </div>
    </main>
  </body>
</html>
